name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # ffmpeg is preinstalled on ubuntu-latest and carries libx264, so the
      # stitching test actually runs here instead of skipping.
      - name: ffmpeg
        run: ffmpeg -version | head -1

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
